name: Docker build and push to ECR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '100808729174' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'task-tracker' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  docker-pr:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: task-tracker:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number }}

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Diagnose GitHub OIDC claims without printing the token
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set +x
          node <<'NODE'
          async function main() {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) {
              throw new Error("GitHub did not provide OIDC request variables.");
            }

            const endpoint = new URL(requestUrl);
            endpoint.searchParams.set("audience", "sts.amazonaws.com");
            const response = await fetch(endpoint, {
              headers: { Authorization: `Bearer ${requestToken}` }
            });
            if (!response.ok) {
              throw new Error("GitHub OIDC token request failed.");
            }

            const { value: jwt } = await response.json();
            const parts = jwt.split(".");
            if (parts.length !== 3) {
              throw new Error("GitHub returned an invalid OIDC token.");
            }

            const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
            const printedClaims = Object.fromEntries(
              ["iss", "aud", "sub", "repository", "ref", "event_name"]
                .map((name) => [name, claims[name] ?? null])
            );
            console.log("OIDC claims only (JWT omitted):");
            console.log(JSON.stringify(printedClaims, null, 2));

            const audiences = Array.isArray(claims.aud) ? claims.aud : [claims.aud];
            const checks = {
              issuer: claims.iss === "https://token.actions.githubusercontent.com",
              audience: audiences.includes("sts.amazonaws.com"),
              subject: claims.sub === "repo:mukeshdara-png@242338459/task-tracker@1468700367:ref:refs/heads/main",
              repository: claims.repository === "mukeshdara-png/task-tracker",
              ref: claims.ref === "refs/heads/main",
              event: claims.event_name === "push",
              awsAccountId: process.env.AWS_ACCOUNT_ID === "100808729174",
              awsRegion: process.env.AWS_REGION === "us-east-1",
              ecrRepository: process.env.ECR_REPOSITORY === "task-tracker",
              roleArn: process.env.AWS_ROLE_ARN === "arn:aws:iam::100808729174:role/GitHubTaskTrackerDev"
            };
            console.log("Expected configuration checks:");
            console.log(JSON.stringify(checks, null, 2));

            if (Object.values(checks).some((matched) => !matched)) {
              process.exitCode = 1;
            }
          }

          main().catch(() => {
            console.error("OIDC diagnostic failed; token and response contents were suppressed.");
            process.exitCode = 1;
          });
          NODE
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build and push immutable SHA and latest tags
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main
