<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main class="shell">
    <header class="hero">
        <p class="eyebrow">YOUR DAY, IN FOCUS</p>
        <h1>Task Tracker<span class="period">.</span></h1>
        <p class="intro">A little structure goes a long way. What would you like to get done?</p>
    </header>

    <section class="panel" aria-labelledby="list-title">
        <form id="task-form" class="task-form">
            <label class="sr-only" for="task-title">New task</label>
            <input id="task-title" name="title" type="text" maxlength="160" placeholder="Add a task to your list..." required>
            <button type="submit">Add task <span aria-hidden="true">+</span></button>
        </form>

        <div class="list-heading">
            <h2 id="list-title">Your tasks</h2>
            <span id="task-count" class="count">0 tasks</span>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
        <p id="empty-state" class="empty-state">Nothing on your list yet. Add a task above to get started.</p>
        <p class="storage-note"><span aria-hidden="true">i</span> Tasks are stored in memory and reset when the app restarts.</p>
    </section>
    <footer>Small steps. Real progress.</footer>
</main>
</body>
</html>
